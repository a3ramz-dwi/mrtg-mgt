<VirtualHost *:80>
  ServerName 10.123.123.202
  ServerAlias localhost mrtg-mgt.local mrtg.triraintiutama.local

  DocumentRoot /var/www/mrtg-mgt/public

  <Directory /var/www/mrtg-mgt/public>
    AllowOverride All
    Options FollowSymLinks
    Require all granted
  </Directory>

  # Allow serving MRTG outputs (graphs/html) from storage
  Alias /mrtg-html /var/www/mrtg-mgt/storage/mrtg/html
  <Directory /var/www/mrtg-mgt/storage/mrtg/html>
    Options FollowSymLinks
    Require all granted
  </Directory>

  Alias /mrtg-images /var/www/mrtg-mgt/storage/mrtg/images
  <Directory /var/www/mrtg-mgt/storage/mrtg/images>
    Options FollowSymLinks
    Require all granted
  </Directory>

  ErrorLog ${APACHE_LOG_DIR}/mrtg-mgt-error.log
  CustomLog ${APACHE_LOG_DIR}/mrtg-mgt-access.log combined
</VirtualHost>
